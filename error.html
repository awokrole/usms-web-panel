{% extends "base.html" %}
{% block title %}{{ title }} — USMS Panel{% endblock %}
{% block content %}
<div class="center-message panel"><h1>{{ title }}</h1><p>{{ message }}</p><a class="small-button" href="{{ url_for('dashboard') }}">Wróć</a></div>
{% endblock %}
{% block public_content %}

{% endblock %}
